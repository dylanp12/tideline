# Fly.io deploy config for the Tideline engine.
app = "tideline" # rename to your own Fly app
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # streams live in memory, so keep at least one machine warm (don't auto-stop to zero)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
