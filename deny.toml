# Supply-chain policy. Financial-services security reviews ask for this, and the
# answer should be a file in the repo rather than a promise.

[advisories]
# Fail on any known vulnerability in the dependency tree.
yanked = "deny"

[licences]
# Permissive only. A copyleft dependency would change what downstream users can
# do with a record verifier they embed, which is not ours to decide for them.
unlicensed = "deny"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
