[project]
name = "tideline"
version = "0.2.0"
description = "Official Python client for TLR/1 — record agent runs, gate high-risk actions on human approval, and verify the result offline. EU AI Act Articles 12 and 14."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Tideline contributors" }]
keywords = ["ai-agents", "audit", "eu-ai-act", "human-in-the-loop", "oversight", "compliance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
]
# No runtime dependencies. A verifier an auditor runs should install nothing.
dependencies = []

[project.urls]
Homepage = "https://github.com/dylanp12/tideline"
Specification = "https://github.com/dylanp12/tideline/blob/main/spec/tlr-1.md"

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tideline"]
