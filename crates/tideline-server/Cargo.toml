[package]
name = "tideline-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference TLR/1 server — tamper-evident agent run records, human-approval gates, and resumable streaming."
keywords = ["ai-agents", "audit", "eu-ai-act", "oversight", "streaming"]
categories = ["web-programming::http-server"]
readme = "README.md"

[[bin]]
name = "tideline-server"
path = "src/main.rs"

[lib]
name = "tideline"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
async-stream = "0.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "catch-panic"] }
async-trait = "0.1"
redis = { version = "0.27", features = ["tokio-comp"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tideline-proto = { version = "0.2.0", path = "../tideline-proto" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio-tungstenite = "0.21"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
tempfile = "3"
