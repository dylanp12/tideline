name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [server, TypeScript SDK, Python SDK, Rust SDK, Go SDK, CLI, spec, conformance suite]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, what happened instead, and the exact error if there is one.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest thing that shows it. A failing record, a curl, a few lines of code.
      render: shell
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.2.0"
    validations: { required: true }
