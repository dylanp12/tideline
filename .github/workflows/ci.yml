name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: engine · fmt + clippy + test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The Redis-backed tests exercise the cross-instance paths (resume, fan-out,
      # and the shared privacy flag) against the service above instead of skipping.
      TIDELINE_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Offline verifier builds without any network dependency
        run: cargo build -p tideline-cli --no-default-features
      - name: Conformance — independent implementation
        run: python3 conformance/independent_check.py
      # Only crates whose dependencies are already on crates.io can be
      # dry-run: `cargo publish` resolves path dependencies against the
      # registry, so the other three fail with "no matching package named
      # tideline-proto" until the first release publishes it. After that,
      # release.yml publishes all four in dependency order.
      - name: Package check
        run: cargo publish -p tideline-proto --dry-run --allow-dirty
      - name: Manifests are complete enough to publish
        run: |
          # What the dry-run would have caught for the other three: missing
          # metadata. Checked directly so it still fails a PR.
          fail=0
          for crate in tideline-server tideline-sdk tideline-cli; do
            meta=$(cargo metadata --no-deps --format-version 1               | python3 -c "
import json,sys
name='$crate'
p=[x for x in json.load(sys.stdin)['packages'] if x['name']==name][0]
missing=[f for f in ('description','license','repository','readme') if not p.get(f)]
print(' '.join(missing))")
            if [ -n "$meta" ]; then echo "  FAIL $crate is missing: $meta"; fail=1
            else echo "  ok   $crate"; fi
          done
          exit $fail

  msrv:
    name: engine · MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Declared in the workspace manifest. A bump is a breaking change for
      # anyone pinned to an older toolchain, so it fails here rather than in
      # someone's build.
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p tideline-proto -p tideline-sdk

  typescript:
    name: sdk · typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The suite drives a real server, not a mock: a mock would agree with
      # whatever the SDK believes, which is the belief under test.
      - run: cargo build --bin tideline-server
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sdk/ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: sdk/ts
      - run: pnpm typecheck
        working-directory: sdk/ts
      - run: pnpm test
        working-directory: sdk/ts
      - run: pnpm build
        working-directory: sdk/ts

  python:
    name: sdk · python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --bin tideline-server
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install pytest build
      - run: python -m pytest sdk/python/tests -q
        env:
          PYTHONPATH: sdk/python/src
      - run: python -m build sdk/python

  go:
    name: sdk · go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --bin tideline-server
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: go vet ./...
        working-directory: sdk/go
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
        working-directory: sdk/go
      - run: go test ./...
        working-directory: sdk/go

  supply-chain:
    name: supply chain · audit + licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
